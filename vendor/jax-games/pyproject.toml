[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-games"
version = "2.0.0"
description = "Pure-JAX game environments for reinforcement learning"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "flax>=0.8.4",
    "jax>=0.4.26",
    "numpy>=1.26",
]

[project.optional-dependencies]
render = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "pillow>=10",
]
play = [
    "jax-games[render]",
    "pygame>=2.5",
]
dev = [
    "jax-games[play]",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
jax-games = "jax_games.cli:main"
play-jax-game = "jax_games.cli:main"
play-craftax = "jax_games.envs.craftax.play_craftax:entry_point"
play-craftax-classic = "jax_games.envs.craftax.craftax_classic.play_craftax_classic:entry_point"

[project.urls]
Homepage = "https://github.com/cj7280/jax-games"
Issues = "https://github.com/cj7280/jax-games/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_games*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "double"
